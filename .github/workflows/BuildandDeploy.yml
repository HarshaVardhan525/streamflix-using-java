name: Build and Deploy
on:
    workflow_dispatch:
permissions:
    contents: read
    id-token: write

jobs:
    Build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Install Java 21
              uses: actions/setup-java@v4
              with:
                distribution : temurin
                java-version: 21
                cache: maven
            - name: java and maven version
              run: |
                java -version
                mvn -version
            - name: Build with maven
              run: mvn clean package
            - name: Verify jar file
              run: |
                ls -l target/*.jar
                echo "Build and deploy workflow completed succesfully"
            - name: prepare EBS package
              run: |
                mkdir -p eb-deployment
                cp target/*.jar eb-deployment/
                echo "web: java -jar *.jar > eb-deployment/Procfile
                ls -la eb-deployment
            - name: upload artifact
              uses: actions/upload-artifact@v4
              with:
                name: streamflix-deployment
                path: eb-deployment
